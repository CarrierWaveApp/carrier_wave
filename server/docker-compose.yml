services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: challenges
      POSTGRES_PASSWORD: challenges
      POSTGRES_DB: challenges
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U challenges"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  server:
    build: .
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: postgres://challenges:challenges@db:5432/challenges
      ADMIN_TOKEN: dev-admin-token
      BASE_URL: http://localhost:8080
      RUST_LOG: debug
      PROPAGATION_ENABLED: "true"
      PROPAGATION_SERVICE_URL: http://propagation:8090
    depends_on:
      db:
        condition: service_healthy
      propagation:
        condition: service_healthy
    networks:
      - internal
      - external

  propagation:
    build: ./propagation
    environment:
      PROPAGATION_LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - internal

networks:
  internal:
    internal: true
  external:

volumes:
  pgdata:
