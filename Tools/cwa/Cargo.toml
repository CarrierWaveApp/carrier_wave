[package]
name = "cwa"
version = "0.1.0"
edition = "2021"
publish = false
description = "Carrier Wave admin CLI — manages the macros registry over HTTP."

[[bin]]
name = "cwa"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
