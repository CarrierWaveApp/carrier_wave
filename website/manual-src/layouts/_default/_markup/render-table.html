{{- /* Wrap every Markdown table so wide tables scroll inside .table-wrap
       instead of stretching the page on narrow screens. */ -}}
<div class="table-wrap">
<table{{ with .Attributes }}{{ range $k, $v := . }} {{ $k }}="{{ $v }}"{{ end }}{{ end }}>
<thead>
{{- range .THead }}
<tr>
{{- range . }}
<th{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</th>
{{- end }}
</tr>
{{- end }}
</thead>
<tbody>
{{- range .TBody }}
<tr>
{{- range . }}
<td{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</td>
{{- end }}
</tr>
{{- end }}
</tbody>
</table>
</div>
