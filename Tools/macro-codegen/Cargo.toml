[package]
name = "macro-codegen"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "macro-codegen"
path = "src/main.rs"

[lib]
name = "macro_codegen"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
