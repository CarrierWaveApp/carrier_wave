# Carrier Wave portable core — Cargo workspace.
#
# Crates (see docs/plans/2026-06-13-rust-core-migration.md):
#   cw-domain  pure logic: query language, band/mode, service types     [tested]
#   cw-ft8     FT8 constants + message logic (C decoder binding pending) [tested]
#   cw-store   SQLCipher-backed entity store + bounded queries           [tested]
#   cw-net     spot/API models + parsing (reqwest transport wraps these) [tested]
#   cw-sync    journal + conflict-resolution + transport trait          [tested]
#   cw-ffi     the single UniFFI cross-language surface                 [tested]
[workspace]
resolver = "2"
members = [
    "cw-domain",
    "cw-ft8",
    "cw-store",
    "cw-net",
    "cw-sync",
    "cw-crypto",
    "cw-ffi",
    "cw-sdr",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4", "v5"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
