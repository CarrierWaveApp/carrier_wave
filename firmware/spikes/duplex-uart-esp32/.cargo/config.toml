[build]
target = "xtensa-esp32-espidf"

[target.xtensa-esp32-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor"

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32"
ESP_IDF_SDKCONFIG_DEFAULTS = "sdkconfig.defaults"
ESP_IDF_VERSION = "v5.4"
# Reuse the main firmware's ESP-IDF checkout instead of cloning another 1 GB.
ESP_IDF_TOOLS_INSTALL_DIR = "custom:/Users/jsvana/projects/carrier_wave/firmware/.embuild"
