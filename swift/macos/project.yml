name: CWSweep
options:
  bundleIdPrefix: com.jsvana
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.3"
  generateEmptyDirectories: false
  groupSortPosition: top

# Versions live in swift/Versions.xcconfig (shared with the iOS project; see
# CAR-158). Never write MARKETING_VERSION / CURRENT_PROJECT_VERSION literals
# here — scripts/check-versions.sh fails if one appears.
configFiles:
  Debug: ../Versions.xcconfig
  Release: ../Versions.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 7UE4RDLUSX
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"

packages:
  CarrierWaveCore:
    path: ../packages/CarrierWaveCore
  CarrierWaveData:
    path: ../packages/CarrierWaveData
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.7.0"

targets:
  CWSweep:
    type: application
    platform: macOS
    sources:
      - path: CWSweep
        excludes:
          - "**/*.entitlements"
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jsvana.CWSweep
        INFOPLIST_FILE: CWSweep/Info.plist
        CODE_SIGN_ENTITLEMENTS: CWSweep/CWSweep.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Carrier Wave: Sweep"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        CURRENT_PROJECT_VERSION: "$(CW_SWEEP_BUILD_NUMBER)"
        MARKETING_VERSION: "$(CW_SWEEP_MARKETING_VERSION)"
        PRODUCT_NAME: "CW Sweep"
        PRODUCT_MODULE_NAME: CWSweep
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: CarrierWaveCore
        product: CarrierWaveCore
      - package: CarrierWaveData
        product: CarrierWaveData
      - package: Sparkle
        product: Sparkle

  CWSweepTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CWSweepTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jsvana.CWSweepTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CW Sweep.app/Contents/MacOS/CW Sweep"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: CWSweep
