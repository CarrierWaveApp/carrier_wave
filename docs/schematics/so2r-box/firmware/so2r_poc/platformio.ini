; PlatformIO config for the SO2R Box POC firmware.
; Companion to so2r_poc.ino - same source compiles either way.
;
; Quick start:
;   pio run -t upload          # build + flash over USB-C
;   pio device monitor         # open the serial REPL @ 115200
;
; Arduino IDE users: ignore this file, open so2r_poc.ino directly. Install
; "Heltec ESP32 Series Dev-Boards" via the board manager and select
; "Heltec WiFi LoRa 32(V3)". Install Adafruit GFX, Adafruit SSD1306, and
; Adafruit NeoPixel from Library Manager.
;
; USB note: the Heltec V3 has an on-board CP2102N USB-UART bridge. Serial
; routes through UART0 -> CP2102N -> USB-C. Do NOT enable
; ARDUINO_USB_CDC_ON_BOOT - that would redirect Serial to the ESP32-S3's
; native USB pins (GPIO 19/20), which are NOT connected to the USB-C port.

[env:heltec_wifi_lora_32_V3]
platform        = espressif32
board           = heltec_wifi_lora_32_V3
framework       = arduino
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
upload_speed    = 921600

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D CORE_DEBUG_LEVEL=3

lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
    adafruit/Adafruit NeoPixel

