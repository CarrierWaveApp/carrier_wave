[project]
name = "carrierwave-propagation"
version = "0.1.0"
description = "HF propagation prediction sidecar for Carrier Wave (wraps dvoacap-python)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "dvoacap @ git+https://github.com/skyelaird/dvoacap-python@main",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
