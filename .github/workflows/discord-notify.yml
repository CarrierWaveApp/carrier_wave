name: Discord Commit Notification

on:
  push:

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        # Commit metadata is attacker-controlled on a public repo (a merged PR
        # carries the contributor's message and author name), so it is passed
        # through env and JSON-encoded by jq, never interpolated into the script.
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          HASH: ${{ github.sha }}
          URL: ${{ github.event.head_commit.url }}
        run: |
          # Forks and fresh clones have no webhook configured; skip quietly.
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_URL not set; skipping"
            exit 0
          fi

          SUBJECT=$(printf '%s\n' "$COMMIT_MSG" | head -1)
          SHORT_HASH="${HASH:0:7}"

          jq -n \
            --arg title "${REPO} — ${BRANCH}" \
            --arg description "[\`${SHORT_HASH}\`](${URL}) ${SUBJECT}" \
            --arg author "$AUTHOR" \
            '{embeds: [{title: $title, description: $description, color: 5814783, footer: {text: $author}}]}' \
            | curl -s -H "Content-Type: application/json" -X POST "$DISCORD_WEBHOOK" -d @-
